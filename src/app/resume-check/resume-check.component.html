<div class="page-center">
  <div class="upload-card">

    <h2>Resume Analyzer</h2>
    <p class="subtitle">Upload your resume and get your score</p>

    <div class="upload-box" (click)="fileInput.click()">
      <input #fileInput type="file" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx">

      <div class="upload-content">
        <div class="icon">📄</div>
        <p class="main-text">Click to upload</p>
        <p class="sub-text">PDF, DOC, DOCX (Max 5MB)</p>
      </div>

      <p class="file-name" *ngIf="fileName">{{ fileName }}</p>
    </div>

    <button (click)="uploadFile()">Upload Resume</button>

  </div>
</div>
